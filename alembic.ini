# Alembic configuration for WEBADC v3.0
# ──────────────────────────────────────────────────────────────────────
# The DB URL is read dynamically by alembic/env.py from app.config
# (DB_URL / SAMBA_DB_URL), so we leave sqlalchemy.url empty here.
# Override with --x db-url=... on the CLI if you need a one-shot override.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

# Timezone for filenames (defaults to UTC)
timezone = UTC

# Output encoding (default utf-8)
output_encoding = utf-8

[post_write_hooks]
# (none — we don't auto-format migrations)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
