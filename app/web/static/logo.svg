<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="12" y1="4" x2="52" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E3A5F"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="shieldClip">
      <path d="M32 4L10 14V28C10 40 20 52 32 58C44 52 54 40 54 28V14L32 4Z"/>
    </clipPath>
  </defs>

  <!-- Shield background -->
  <path d="M32 4L10 14V28C10 40 20 52 32 58C44 52 54 40 54 28V14L32 4Z"
        fill="url(#bgGrad)" stroke="url(#shieldGrad)" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Server rack lines -->
  <g clip-path="url(#shieldClip)" opacity="0.9">
    <!-- Top server unit -->
    <rect x="20" y="16" width="24" height="5" rx="1" fill="#1E293B" stroke="#334155" stroke-width="0.5"/>
    <circle cx="39" cy="18.5" r="1.2" fill="#10B981" filter="url(#glow)"/>
    <circle cx="43" cy="18.5" r="1.2" fill="#10B981" opacity="0.5"/>

    <!-- Middle server unit -->
    <rect x="20" y="23" width="24" height="5" rx="1" fill="#1E293B" stroke="#334155" stroke-width="0.5"/>
    <circle cx="39" cy="25.5" r="1.2" fill="#10B981" filter="url(#glow)"/>
    <circle cx="43" cy="25.5" r="1.2" fill="#34D399" opacity="0.4"/>

    <!-- Bottom server unit -->
    <rect x="20" y="30" width="24" height="5" rx="1" fill="#1E293B" stroke="#334155" stroke-width="0.5"/>
    <circle cx="39" cy="32.5" r="1.2" fill="#10B981" filter="url(#glow)"/>
    <circle cx="43" cy="32.5" r="1.2" fill="#10B981" opacity="0.3"/>
  </g>

  <!-- Network / connection arcs -->
  <path d="M32 38 Q26 42 22 46" stroke="#10B981" stroke-width="1" fill="none" opacity="0.6" stroke-linecap="round"/>
  <path d="M32 38 Q38 42 42 46" stroke="#10B981" stroke-width="1" fill="none" opacity="0.6" stroke-linecap="round"/>
  <path d="M32 38 L32 46" stroke="#10B981" stroke-width="1" fill="none" opacity="0.4" stroke-linecap="round"/>

  <!-- Central node -->
  <circle cx="32" cy="46" r="2.5" fill="#10B981" opacity="0.2"/>
  <circle cx="32" cy="46" r="1.5" fill="#10B981" filter="url(#glow)"/>

  <!-- Top accent glow line -->
  <path d="M20 14 L32 8 L44 14" stroke="#10B981" stroke-width="0.5" fill="none" opacity="0.3"/>
</svg>